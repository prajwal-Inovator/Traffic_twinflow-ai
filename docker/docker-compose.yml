version: '3.8'

services:
  # ---------- Databases ----------
  mongodb:
    image: mongo:7.0
    container_name: twinflow-mongo-prod
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
      MONGO_INITDB_DATABASE: twinflow
    volumes:
      - mongo_data_prod:/data/db
      - ../database/migrations/init_mongodb.js:/docker-entrypoint-initdb.d/init.js
    networks:
      - twinflow-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: twinflow-redis-prod
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASS}
    volumes:
      - redis_data_prod:/data
    networks:
      - twinflow-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Backend ----------
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
      target: production  # if we add multi-stage
    container_name: twinflow-backend-prod
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://${MONGO_USER}:${MONGO_PASS}@mongodb:27017/twinflow?authSource=admin
      - REDIS_URL=redis://:${REDIS_PASS}@redis:6379
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - OPENAQ_API_KEY=${OPENAQ_API_KEY}
      - DEBUG=false
      - CORS_ORIGINS=${CORS_ORIGINS}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../datasets:/datasets:ro
    networks:
      - twinflow-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------- AI Engine ----------
  ai:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ai
      target: production
    container_name: twinflow-ai-prod
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - MONGO_URI=mongodb://${MONGO_USER}:${MONGO_PASS}@mongodb:27017/twinflow?authSource=admin
      - REDIS_URL=redis://:${REDIS_PASS}@redis:6379
      - MODEL_DIR=/models
      - DEBUG=false
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../models:/models:ro
      - ../datasets:/datasets:ro
    networks:
      - twinflow-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]  # if GPU available

  # ---------- Simulation (SUMO) ----------
  simulation:
    build:
      context: ..
      dockerfile: docker/Dockerfile.simulation
      target: production
    container_name: twinflow-simulation-prod
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      - MONGO_URI=mongodb://${MONGO_USER}:${MONGO_PASS}@mongodb:27017/twinflow?authSource=admin
      - DEBUG=false
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ../simulation:/app:ro
      - ../datasets:/datasets:ro
    networks:
      - twinflow-net

  # ---------- n8n ----------
  n8n:
    image: n8nio/n8n:latest
    container_name: twinflow-n8n-prod
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=n8n
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - DB_TYPE=postgresdb   # can use SQLite for simplicity
      - DB_SQLITE_DATABASE=/home/node/.n8n/database.sqlite
    volumes:
      - n8n_data_prod:/home/node/.n8n
    networks:
      - twinflow-net

  # ---------- Frontend ----------
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      target: production
    container_name: twinflow-frontend-prod
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
      - ai
      - simulation
    networks:
      - twinflow-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mongo_data_prod:
  redis_data_prod:
  n8n_data_prod:

networks:
  twinflow-net:
    driver: bridge
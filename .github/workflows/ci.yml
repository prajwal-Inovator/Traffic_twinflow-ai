- name: Run Backend Tests
  run: |
    cd backend
    pip install -r requirements.txt
    pip install pytest pytest-asyncio pytest-cov
    pytest tests/

- name: Run Frontend Tests
  run: |
    cd frontend
    npm install
    npm run test

- name: Run E2E Tests
  run: |
    npm install -g playwright
    playwright install
    npm run test:e2e
# render.yaml
services:
  # Backend API
  - name: twinflow-backend
    type: web
    runtime: image
    repo: https://github.com/your-org/twinflow-ai
    branch: main
    plan: professional
    dockerfilePath: docker/Dockerfile.backend
    dockerContext: .
    envVars:
      - key: MONGO_URI
        fromDatabase:
          name: twinflow-mongo
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: twinflow-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: CORS_ORIGINS
        value: https://twinflow-frontend.onrender.com
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: OPENAQ_API_KEY
        sync: false
      - key: DEBUG
        value: false
    healthCheckPath: /health
    numReplicas: 2
    scaling:
      minInstances: 2
      maxInstances: 10
      targetMemoryPercent: 80
      targetCPUPercent: 70

  # AI Engine
  - name: twinflow-ai
    type: web
    runtime: image
    repo: https://github.com/prajwal-Inovator/Traffic_twinflow-ai
    branch: main
    plan: professional
    dockerfilePath: docker/Dockerfile.ai
    dockerContext: .
    envVars:
      - key: MONGO_URI
        fromDatabase:
          name: twinflow-mongo
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: twinflow-redis
          type: redis
          property: connectionString
      - key: DEBUG
        value: false
    healthCheckPath: /health
    numReplicas: 1

  # Simulation (SUMO) – might not scale, can be a worker
  - name: twinflow-simulation
    type: worker
    runtime: image
    repo: https://github.com/your-org/twinflow-ai
    branch: main
    plan: starter
    dockerfilePath: docker/Dockerfile.simulation
    dockerContext: .
    envVars:
      - key: MONGO_URI
        fromDatabase:
          name: twinflow-mongo
          property: connectionString
      - key: DEBUG
        value: false

  # Frontend (Static Site)
  - name: twinflow-frontend
    type: web
    runtime: static
    repo: https://github.com/your-org/twinflow-ai
    branch: main
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://twinflow-backend.onrender.com/api
      - key: VITE_WS_URL
        value: wss://twinflow-backend.onrender.com/ws
      - key: VITE_MAPBOX_TOKEN
        sync: false

databases:
  - name: twinflow-mongo
    databaseName: twinflow
    user: admin
    plan: starter
  - name: twinflow-redis
    plan: starter
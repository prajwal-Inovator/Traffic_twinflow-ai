[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "twinflow-backend"
version = "1.0.0"
description = "TwinFlow AI Backend - FastAPI + Socket.IO + MongoDB"
readme = "README.md"
authors = [{ name = "TwinFlow Team", email = "team@twinflow.ai" }]
license = { text = "Proprietary" }
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "motor==3.6.0",
    "redis==5.2.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.6.1",
    "python-dotenv==1.0.1",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.20",
    "python-socketio[asyncio]==5.11.4",
    "httpx==0.28.1",
    "aiofiles==24.1.0",
    "loguru==0.7.2",
    "python-dateutil==2.9.0",
    "pytz==2024.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "black==24.10.0",
    "isort==5.13.2",
    "flake8==7.1.1",
    "mypy==1.13.0",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"